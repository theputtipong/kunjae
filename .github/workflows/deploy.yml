name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "จะ deploy อะไร"
        required: true
        type: choice
        default: both
        options: [api, web, both]
      run_migrations:
        description: "รัน D1 migration ด้วย (ถอยกลับไม่ได้)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: ด่านเดิมต้องผ่านก่อนเสมอ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint build

  api:
    name: Worker (API)
    needs: verify
    if: inputs.target == 'api' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: D1 migration
        if: inputs.run_migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply kunjae --remote

      - name: deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: ตรวจว่ายังมีชีวิตหลัง deploy
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${API_BASE_URL}" || { echo "::error::ยังไม่ได้ตั้งตัวแปร API_BASE_URL"; exit 1; }
          curl -fsS "${API_BASE_URL}/health" | grep -q '"ok"'
          echo "API ตอบกลับปกติ"

  web:
    name: หน้าเว็บ
    needs: verify
    if: inputs.target == 'web' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build หน้าเว็บ
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          VITE_CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
          VITE_PLAY_SIGNING_CERT_SHA256: ${{ vars.PLAY_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "${VITE_API_BASE_URL}" || { echo "::error::ยังไม่ได้ตั้งตัวแปร API_BASE_URL"; exit 1; }
          case "${VITE_API_BASE_URL}" in
            https://*) ;;
            *) echo "::error::API_BASE_URL ต้องเป็น https"; exit 1 ;;
          esac
          pnpm --filter @kunjae/web build

      - name: _headers ต้องอนุญาต origin ของ API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          grep -q "connect-src[^;]*${API_BASE_URL}" apps/web/dist/_headers || {
            echo "::error::connect-src ใน _headers ไม่มี ${API_BASE_URL} — แอปจะยิงคำขอไม่ออก"
            exit 1
          }
          echo "CSP อนุญาต ${API_BASE_URL} แล้ว"

      - name: deploy หน้าเว็บ (Workers Static Assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: bash scripts/ci/deploy-web.sh

      - name: ตรวจโดเมนจริงหลัง deploy
        env:
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "${WEB_ORIGIN}" || { echo "::error::ยังไม่ได้ตั้งตัวแปร WEB_ORIGIN"; exit 1; }
          for i in $(seq 1 30); do
            curl -fsS "${WEB_ORIGIN}/" | grep -q '<div id="root">' && break
            sleep 10
          done
          curl -fsSI "${WEB_ORIGIN}/" | grep -qi "content-security-policy"
          curl -fsS "${WEB_ORIGIN}/.well-known/assetlinks.json" | jq -e '.[0].target.package_name == "com.kunjae.app"' > /dev/null
          curl -fsS "${WEB_ORIGIN}/site.webmanifest" | jq -e '.related_applications[0].id == "com.kunjae.app"' > /dev/null
          echo "${WEB_ORIGIN} ใช้งานได้"
