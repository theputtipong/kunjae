name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        default: both
        options: [api, web, both]
      run_migrations:
        description: "Also apply D1 migrations (irreversible)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] standard pins the ./ form (actionlint-compatible)

  preflight:
    name: Preflight
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Environment-scoped vars and secrets are only visible to jobs bound to the environment.
    environment: production
    outputs:
      api: ${{ steps.config.outputs.present == 'true' && steps.target.outputs.api == 'true' }}
      web: ${{ steps.config.outputs.present == 'true' && steps.target.outputs.web == 'true' }}
    steps:
      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          # Pushes to main always deploy both.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then TARGET=both; fi
          case "$TARGET" in
            api) echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=false" >> "$GITHUB_OUTPUT" ;;
            web) echo "api=false" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check config
        id: config
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$API_BASE_URL" ] || missing="$missing vars.API_BASE_URL"
          [ -n "$WEB_ORIGIN" ] || missing="$missing vars.WEB_ORIGIN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped: environment production is missing${missing}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API
    needs: preflight
    if: needs.preflight.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache: a deploy build must not restore anything a PR run could have written.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations are irreversible, so only a manual run with run_migrations=true applies them.
      - name: Apply D1 migrations
        if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply kunjae --remote

      - name: Deploy API
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke test
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          curl -fsS "${API_BASE_URL}/health" | grep -q '"ok"'
          echo "API is healthy"

  deploy-web:
    name: Deploy Web
    needs: preflight
    if: needs.preflight.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache: a deploy build must not restore anything a PR run could have written.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          VITE_CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
          VITE_PLAY_SIGNING_CERT_SHA256: ${{ vars.PLAY_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          case "${VITE_API_BASE_URL}" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be https"; exit 1 ;;
          esac
          pnpm --filter @kunjae/web build

      - name: Check _headers allows the API origin
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          grep -q "connect-src[^;]*${API_BASE_URL}" apps/web/dist/_headers || {
            echo "::error::connect-src in _headers does not include ${API_BASE_URL}; the app could not reach the API"
            exit 1
          }
          echo "CSP allows ${API_BASE_URL}"

      # Workers Static Assets.
      - name: Deploy web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: bash scripts/ci/deploy-web.sh

      # Page, CSP, assetlinks, manifest.
      - name: Smoke test
        env:
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            curl -fsS "${WEB_ORIGIN}/" | grep -q '<div id="root">' && break
            sleep 10
          done
          curl -fsSI "${WEB_ORIGIN}/" | grep -qi "content-security-policy"
          curl -fsS "${WEB_ORIGIN}/.well-known/assetlinks.json" | jq -e '.[0].target.package_name == "com.kunjae.app"' > /dev/null
          curl -fsS "${WEB_ORIGIN}/site.webmanifest" | jq -e '.related_applications[0].id == "com.kunjae.app"' > /dev/null
          echo "${WEB_ORIGIN} is up"
