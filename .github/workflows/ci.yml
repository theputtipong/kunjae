name: CI

# Pushes to main get CI through the `ci` job of deploy.yml, so this file has no push trigger.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a deploy run never shares a group with a PR run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  commits:
    name: Commit messages
    # Advisory only: non-conventional messages are reported as warnings and never fail CI.
    # The repo hook is stricter than plain Conventional Commits.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          check_msg() { sh .githooks/commit-msg "$1"; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            set -- "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            set -- "$PUSH_BEFORE..$PUSH_SHA"
          else
            set -- --max-count=20 "$PUSH_SHA"
          fi
          bad=0
          for sha in $(git rev-list "$@"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! check_msg "$RUNNER_TEMP/msg"; then
              echo "::warning::$sha does not follow the commit convention: $(head -n 1 "$RUNNER_TEMP/msg")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then echo "::notice::Commit message check is advisory and does not fail CI."; fi

  check-typescript:
    name: Check TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      # Build stays before Test (order of the former single turbo step), in case tests read built outputs.
      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm -r --if-present test

      - name: Crypto vectors regenerate identically
        run: |
          pnpm --filter @kunjae/crypto-spec generate
          git diff --exit-code -- packages/crypto-spec/vectors

  check-android:
    name: Check Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify crypto vectors match TypeScript bit for bit
        working-directory: apps/android
        run: ./gradlew verifyVectors --no-daemon

      - name: Verify autofill decisions (pure functions, no emulator)
        working-directory: apps/android
        run: ./gradlew verifyAutofill --no-daemon

      - name: Verify local vault (encrypt, open, change password, delete)
        working-directory: apps/android
        run: ./gradlew verifyLocalVault --no-daemon

      # Unsigned release so R8 runs for real.
      - name: Build
        working-directory: apps/android
        env:
          KUNJAE_RELEASE_API_BASE_URL: https://api.invalid
        run: ./gradlew :app:assembleRelease --no-daemon

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # shortcut: existing advisories GHSA-2m5v-pch6-74hx GHSA-4w7w-5xrc-9h26 GHSA-qrxm-fqhp-jwvm GHSA-rfgv-xxqx-mfg5
        # GHSA-w293-vg96-wgc3 GHSA-xjj6-f33q-929c (undici) GHSA-587h-7wmj-h5pm (vite) GHSA-68fv-2mgg-jv7q (source-map-js)
        # GHSA-7rv5-mrxv-xcr9 GHSA-97r2-qh9m-474h GHSA-wp97-x4hv-qvhp (seroval) GHSA-mrhx-c7xc-m3w5 (zod) GHSA-wq5f-xc86-pv6w (sharp),
        # remove after dependabot bumps
        continue-on-error: true
        run: pnpm audit --audit-level=high
