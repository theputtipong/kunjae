name: Android — ส่งให้ผู้ทดสอบ

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "บันทึกที่จะแสดงให้ผู้ทดสอบเห็น"
        required: false
        default: "build ทดสอบจากสาขาหลัก"
  push:
    tags: ["android-v*"]

permissions:
  contents: write

concurrency:
  group: android-distribute
  cancel-in-progress: false

jobs:
  distribute:
    name: build · ลงนาม · ส่งให้ผู้ทดสอบ
    runs-on: ubuntu-latest

    environment: android-release

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: คลายกุญแจลงนามออกมา
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/kunjae-release.jks"
          keytool -list -keystore "${RUNNER_TEMP}/kunjae-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null
          echo "กุญแจพร้อมใช้งาน"

      - name: build APK ที่ลงนามแล้ว
        working-directory: apps/android
        env:
          KUNJAE_KEYSTORE_PATH: ${{ runner.temp }}/kunjae-release.jks
          KUNJAE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KUNJAE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUNJAE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KUNJAE_RELEASE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "${KUNJAE_RELEASE_API_BASE_URL}" || { echo "::error::ยังไม่ได้ตั้งตัวแปร API_BASE_URL"; exit 1; }
          ./gradlew :app:assembleRelease --no-daemon

      - name: ยืนยันว่า APK ลงนามแล้ว
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::ไม่พบ APK ที่ลงนามแล้ว — น่าจะได้ไฟล์ unsigned แทน"; exit 1; }
          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: ตั้งชื่อไฟล์ตามรุ่น
        id: apk
        run: |
          NAME="kunjae-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/${NAME}"
          echo "path=${RUNNER_TEMP}/${NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: มี Firebase หรือไม่
        id: firebase
        env:
          APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: echo "enabled=$([ -n "${APP_ID}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: แนบ APK ไว้ใน GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" \
            --title "Android ${GITHUB_REF_NAME#android-v}" --generate-notes

      - name: เก็บ APK เป็น artifact (7 วัน)
        if: "!startsWith(github.ref, 'refs/tags/android-v') && steps.firebase.outputs.enabled != 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: ติดตั้ง firebase-tools (ตรึงเวอร์ชัน)
        if: steps.firebase.outputs.enabled == 'true'
        run: npm install -g firebase-tools@14.24.0

      - name: ส่งให้ผู้ทดสอบ
        if: steps.firebase.outputs.enabled == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          RELEASE_NOTES: ${{ github.event.inputs.notes || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "${GOOGLE_APPLICATION_CREDENTIALS}"
          firebase appdistribution:distribute \
            apps/android/app/build/outputs/apk/release/app-release.apk \
            --app "${FIREBASE_APP_ID}" \
            --groups testers \
            --release-notes "${RELEASE_NOTES} · commit ${GITHUB_SHA}"

      - name: ลบกุญแจและบัญชีบริการทิ้ง
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/kunjae-release.jks" "${RUNNER_TEMP}/firebase-service-account.json"
